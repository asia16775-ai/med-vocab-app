<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVocab — เข้าสู่ระบบ</title>
  <script>
    (function() {
      const saved = localStorage.getItem('mv_theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-2: #f0f0f5;
      --primary: #003087;
      --primary-l: #0051CC;
      --text: #1d1d1f;
      --text-2: #6e6e73;
      --border: rgba(0,0,0,0.08);
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --primary: #4d9fff;
      --primary-l: #6ab0ff;
      --text: #f5f5f7;
      --text-2: #98989d;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0a0f2c 0%, #003087 60%, #1565c0 100%);
      padding: 24px;
      transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] body {
      background: linear-gradient(160deg, #000000 0%, #0a0a1a 60%, #001a4d 100%);
    }

    #theme-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      z-index: 100;
    }
    #theme-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.25); }
    #theme-btn:active { transform: scale(0.93); }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 4px;
    }

    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: var(--transition);
      -webkit-appearance: none;
    }
    .field input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(0,48,135,0.12);
    }
    [data-theme="dark"] .field input:focus {
      box-shadow: 0 0 0 3px rgba(77,159,255,0.2);
    }
    .field input::placeholder { color: var(--text-2); opacity: 0.7; }

    #error-msg {
      display: none;
      background: #fff0f0;
      color: #c0392b;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
      text-align: center;
    }
    [data-theme="dark"] #error-msg {
      background: rgba(192,57,43,0.15);
      color: #ff6b6b;
    }
    #error-msg.show { display: block; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    .shake { animation: shake 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 4px;
    }
    .btn-primary:hover { background: var(--primary-l); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 10px;
    }
    .btn-secondary:hover { background: rgba(0,48,135,0.06); }
    [data-theme="dark"] .btn-secondary:hover { background: rgba(77,159,255,0.1); }
    .btn-secondary:active { transform: scale(0.97); }

    .admin-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-2);
      text-decoration: none;
      transition: color 0.2s;
    }
    .admin-link:hover { color: var(--primary); }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <button id="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>

  <div class="card" id="login-card">
    <div class="logo">
      <span class="logo-icon">🩺</span>
      <h1>MedVocab</h1>
      <p>ระบบทบทวนคำศัพท์ทางการแพทย์ · โลหิตวิทยา</p>
    </div>

    <div class="field">
      <label for="username">เลขประจำตัวนิสิต</label>
      <input type="text" id="username" placeholder="กรอกเลขประจำตัวนิสิต" autocomplete="off" autocapitalize="none" inputmode="numeric">
    </div>

    <div id="error-msg"></div>

    <button class="btn-primary" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>

    <a href="admin_login.html" class="admin-link">เข้าสู่ระบบผู้วิจัย</a>
  </div>

  <script src="js/config.js"></script>
  <script>
    initTheme();
    document.getElementById('theme-btn').textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';

    // Redirect if already logged in
    sessionStorage.removeItem('mv_sim_user'); // clear simulate session
    if (localStorage.getItem('mv_current')) location.href = 'home.html';
    if (sessionStorage.getItem('mv_admin')) location.href = 'admin.html';

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('login-card').classList.remove('shake');
      void document.getElementById('login-card').offsetWidth;
      document.getElementById('login-card').classList.add('shake');
    }

    async function doLogin() {
      const btn = document.getElementById('login-btn');
      const u = document.getElementById('username').value.trim();

      if (!u) { showError('กรุณากรอกเลขประจำตัวนิสิต'); return; }
      if (!/^\d{5,15}$/.test(u)) { showError('เลขประจำตัวนิสิตไม่ถูกต้อง'); return; }

      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ…';

      try {
        // ตรวจสอบว่ามีในระบบแล้วหรือยัง
        const checkRes = await fetch(
          `${SUPABASE_URL}/rest/v1/users?username=eq.${encodeURIComponent(u)}&select=username`,
          { headers: HEADERS }
        );
        const existing = await checkRes.json();

        if (existing && existing.length > 0) {
          // มีแล้ว → login เลย
          localStorage.setItem('mv_current', existing[0].username);
          location.href = 'home.html';
        } else {
          // ยังไม่มี → สร้าง user ใหม่อัตโนมัติ
          btn.textContent = 'กำลังลงทะเบียน…';
          const createRes = await fetch(
            `${SUPABASE_URL}/rest/v1/users`,
            {
              method: 'POST',
              headers: { ...HEADERS, 'Prefer': 'return=representation' },
              body: JSON.stringify({
                username: u,
                password: u,          // ไม่ใช้งาน แต่ schema ต้องการ
                registered_at: new Date().toISOString()
              })
            }
          );
          if (createRes.ok) {
            localStorage.setItem('mv_current', u);
            location.href = 'home.html';
          } else {
            const err = await createRes.json();
            showError('ไม่สามารถสร้างบัญชีได้: ' + (err.message || createRes.status));
            btn.disabled = false;
            btn.textContent = 'เข้าสู่ระบบ';
          }
        }
      } catch (err) {
        showError('เกิดข้อผิดพลาด กรุณาลองใหม่');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    }
  </script>
</body>
</html>
